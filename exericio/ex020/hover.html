<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        div > p{
            display: none;

        }

        div:hover > p{
            display: block;
            color: white;
            background-image: linear-gradient(to right, blue, pink);
            width: 300px;
        }

        div:hover{
            color: lightblue;
        } 

    </style>
</head>
<body>
    <h1>Exemplos de hover</h1>
    <p>Passe o mouse sobre o texti abaixo:</p>
    <div>
        Passe o Mouse aqui
        <p>MEU CU NÉ MORES</p>
    </div>
    
</body>
</html>
