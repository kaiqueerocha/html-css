<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em html 5</title>
</head>
<body>
    <h1>Imagens Dinamicas</h1>
    <p>Tente abrir esse site em varios dispositivos diferentes ou <br>simplesmente aumente ou diminua o tamanho do navegador</p>
    <picture>
        <source media="(max-width: 700px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1000px)" srcset="imagens/foto-m.png" type="image/png">
      <img src="imagens/foto-g.png" alt="imagem flexivel">
    </picture>
    <h1>trabalhando com Audio</h1>
    <p>vamos aprender a reproduzir audios em html 5</p>
    <audio src="midia/Me In My Own Skin - The Soundlings.mp3" controls autoplay ></audio>
</body>
</html>
