<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1{
            background-color: lightgray;
            height: 100px;
            width: 500px;
            border-radius: 30px;
            box-shadow: 5px 5px 15px rgb(60, 68, 77);
            
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            padding-right: 10px;

            margin: auto;
              
        }

        a{
            color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa Box-Level</h1>
    <p>Paragrafos tambem sao exemplos de box-level, mas os <a href="#">links</a> são exemplos de inline-levels.Vamos ver como isso funciona</p>
    
</body>
</html>
